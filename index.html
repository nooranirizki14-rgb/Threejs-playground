<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elastic Morty — pull his face</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="scene"></div>
  <div class="ui">
    <h1>ELASTIC <span>MORTY</span></h1>
    <p class="hint">drag his face to pull · double-click to poke · drag the background to orbit · scroll to zoom</p>
  </div>
  <div class="panel">
    <span class="lbl">🍮 jelly</span>
    <input id="jelly" type="range" min="40" max="220" value="110" />
    <span class="lbl">firm 🗿</span>
    <button id="btn-poke">poke 👉</button>
    <button id="btn-reset">reset</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

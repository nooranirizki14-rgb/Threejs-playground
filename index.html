<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locked in the car</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('err');
      if (el) {
        el.classList.remove('hidden');
        el.textContent = '💥 ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      }
    }, true);
    setTimeout(function () {
      if (!window.__bootOK) {
        var el = document.getElementById('err');
        if (el && el.classList.contains('hidden')) {
          el.classList.remove('hidden');
          el.textContent = '⏳ still loading… if this stays, try Chrome + hard refresh (Ctrl+Shift+R).';
        }
      }
    }, 9000);
  </script>
</head>
<body>
  <div id="err" class="hidden"></div>
  <div id="scene"></div>
  <div class="ui">
    <h1>IN THE <span>CAR</span></h1>
    <p class="hint">click to look around · A/D steer · L lights · E try the door 🔒</p>
  </div>
  <div id="toast" class="hidden"></div>
  <div id="play">
    <h2>▶ CLICK TO SIT INSIDE</h2>
    <p>night road. doors are locked. you can't get out.</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

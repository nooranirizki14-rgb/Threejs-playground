<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elastic Morty — pull his face</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('err');
      if (el) {
        el.classList.remove('hidden');
        el.textContent = '💥 ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      }
    }, true);
    setTimeout(function () {
      if (!window.__mortyOK) {
        var el = document.getElementById('err');
        if (el && el.classList.contains('hidden')) {
          el.classList.remove('hidden');
          el.textContent = '⏳ still loading… if this stays, try Chrome + hard refresh (Ctrl+Shift+R).';
        }
      }
    }, 9000);
  </script>
</head>
<body>
  <div id="err" class="hidden"></div>
  <div id="scene"></div>
  <div class="ui">
    <h1>ELASTIC <span>MORTY</span></h1>
    <p class="hint">drag his face to pull · double-click to poke · drag the background to orbit · scroll to zoom</p>
  </div>
  <div class="panel">
    <span class="lbl">🍮 jelly</span>
    <input id="jelly" type="range" min="40" max="220" value="110" />
    <span class="lbl">firm 🗿</span>
    <button id="btn-poke">poke 👉</button>
    <button id="btn-reset">reset</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
